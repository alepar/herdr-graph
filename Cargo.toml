[package]
name = "herdr-graph"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "herdr_graph"
path = "src/lib.rs"

[[bin]]
name = "herdr-graph"
path = "src/main.rs"

[features]
default = ["threads-service-ack"]
# Failpoints and other test-only hooks (crash-injection, hg-zmi.3).
test-support = []
# herdr-threads service ACK delivery (spec §7.4); needs herdr-threads with ht-5nb (service_session_v2).
# On by default; a service older than ht-5nb refuses v2 registration and graph falls back to Notify.
threads-service-ack = []
# Tier-3 private Herdr server tests (spec §11).
private-herdr = []

[dependencies]
herdr-threads = { path = "third_party/herdr-threads" }
# Versions chosen to unify with herdr-threads' exact pins.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
clap = { version = "4.6.4", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
sha2 = "0.10.9"
toml = "1"
chrono = { version = "0.4", features = ["serde"] }
ulid = "1"
async-trait = "0.1"
thiserror = "2"
anyhow = "1"
git2 = { version = "0.20", default-features = false }
libgit2-sys = { version = "0.18", default-features = false }
rusqlite = { version = "=0.39.0", features = ["bundled"] }
libc = "=0.2.189"
uuid = { version = "=1.24.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
proptest = "1"
